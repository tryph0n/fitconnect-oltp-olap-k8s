apiVersion: batch/v1
kind: Job
metadata:
  name: fitconnect-seed
  namespace: fitconnect
spec:
  template:
    metadata:
      labels:
        app: fitconnect-pipeline
    spec:
      containers:
        - name: seed
          image: sambot961/fitconnect-pipeline:latest
          imagePullPolicy: Always
          command: ["uv", "run", "fc-seed"]
          envFrom:
            - secretRef:
                name: fitconnect-env
      restartPolicy: Never
  backoffLimit: 2
