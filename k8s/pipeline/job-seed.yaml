apiVersion: batch/v1
kind: Job
metadata:
  name: fitconnect-seed
  namespace: fitconnect
spec:
  template:
    metadata:
      labels:
        app: fitconnect-pipeline
    spec:
      containers:
        - name: seed
          image: ghcr.io/tryph0n/fitconnect-pipeline:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["fc-seed"]
          envFrom:
            - secretRef:
                name: fitconnect-env
      restartPolicy: Never
  backoffLimit: 2
