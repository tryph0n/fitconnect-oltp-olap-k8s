# S3 disk for ClickHouse, used by `make up S3=moto` (s3-patch.yaml mounts it in config.d).
# The endpoint and keys come from the fitconnect-env secret (S3_* keys of .env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: fitconnect
data:
  storage.xml: |
    <clickhouse>
      <storage_configuration>
        <disks>
          <s3>
            <type>s3</type>
            <endpoint from_env="S3_ENDPOINT"/>
            <access_key_id from_env="S3_ACCESS_KEY_ID"/>
            <secret_access_key from_env="S3_SECRET_ACCESS_KEY"/>
          </s3>
        </disks>
        <policies>
          <s3_main>
            <volumes>
              <main>
                <disk>s3</disk>
              </main>
            </volumes>
          </s3_main>
        </policies>
      </storage_configuration>
      <!-- New MergeTree tables use the S3 disk unless they name another policy. -->
      <merge_tree>
        <storage_policy>s3_main</storage_policy>
      </merge_tree>
    </clickhouse>
