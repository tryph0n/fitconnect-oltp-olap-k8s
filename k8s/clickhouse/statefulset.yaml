apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: fitconnect
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8.14.39
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          envFrom:
            - secretRef:
                name: fitconnect-env
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: chdata
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: chdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
