[project]
name = "fitconnect"
version = "0.2.0"
description = "FitConnect: PostgreSQL to ClickHouse with dlt, snapshot and change data capture, on Kubernetes"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "pg_replication/LICENSE.txt"]
authors = [{ name = "Samy Saad" }]
dependencies = [
    "dlt[clickhouse,sql_database]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandas>=2.0",
    "pydantic-settings>=2.13.1",
    "psycopg2-binary>=2.9.9",
    "clickhouse-connect>=0.14.0",
]

[project.urls]
Repository = "https://github.com/tryph0n/learn_ga_to_psql"

[project.scripts]
fc-seed = "fitconnect.seed:main"
fc-cdc-setup = "fitconnect.cdc_setup:main"
fc-pipeline = "fitconnect.pipeline:main"
fc-cdc-consumer = "fitconnect.cdc_consumer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitconnect", "pg_replication"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.15.0",
    "testcontainers[clickhouse,postgres]==4.15.0",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["pg_replication"]
force-exclude = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs Docker; starts PostgreSQL and ClickHouse containers"]
# dlt 1.23 sql_database warns about its own default value of this argument
filterwarnings = ["ignore:`detect_precision_hints` argument is deprecated:DeprecationWarning"]
